services:
  - type: web
    name: restaurant
    env: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: node index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: restaurant-restaurant-sigma.vercel.app
